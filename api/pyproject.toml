[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dividend-analyzer-api"
version = "0.3.0"
description = "FastAPI wrapper for dividend-analyzer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "psycopg2-binary>=2.9.10",
  "redis>=5.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
